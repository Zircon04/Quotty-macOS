name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release'
        required: true
        default: '1.4.2'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Quotty application
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh
          ditto -c -k --sequesterRsrc --keepParent Quotty.app Quotty-macOS.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Quotty for macOS v${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: Quotty-macOS.zip
          generate_release_notes: false

      - name: Update Release Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat RELEASE_NOTES.md | python3 -c "import sys, json; print(json.dumps(sys.stdin.read()))")
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))")
          if [ -n "$RELEASE_ID" ]; then
            echo "Updating release $RELEASE_ID..."
            curl -s -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -d "{\"body\": $BODY}"
          fi

